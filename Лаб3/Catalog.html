<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Каталог услуг — Görm Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    /* === СТИЛИ ДЛЯ КАТАЛОГА === */
    .catalog-page { padding-top: 120px; min-height: 100vh; background: #000; color: #fff; }
    .catalog-header { max-width: 1440px; margin: 0 auto; padding: 0 60px 40px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
    .catalog-title { font-size: clamp(2rem, 4vw, 3rem); font-weight: 500; text-transform: uppercase; letter-spacing: -0.5px; }
    .catalog-controls { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
    .search-box { position: relative; }
    .search-box input { background: #111116; border: 1px solid #333; color: #fff; padding: 10px 16px 10px 36px; border-radius: 4px; font-size: 13px; width: 220px; transition: border-color 0.3s; }
    .search-box input:focus { border-color: #D3100D; outline: none; }
    .search-box::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: #666; }
    .filter-select { background: #111116; border: 1px solid #333; color: #fff; padding: 10px 16px; border-radius: 4px; font-size: 13px; cursor: pointer; }
    .filter-select:focus { border-color: #D3100D; outline: none; }
    .category-filter { display: flex; gap: 8px; flex-wrap: wrap; }
    .category-btn { background: transparent; border: 1px solid #333; color: #888; padding: 6px 14px; border-radius: 20px; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.3s; }
    .category-btn:hover, .category-btn.active { background: #D3100D; border-color: #D3100D; color: #fff; }
    
    .methods-panel { max-width: 1440px; margin: 0 auto 30px; padding: 0 60px; }
    .methods-grid { display: flex; flex-wrap: wrap; gap: 10px; }
    .method-btn { background: #1a1a1a; border: 1px solid #333; color: #ccc; padding: 8px 14px; border-radius: 4px; font-size: 11px; text-transform: uppercase; cursor: pointer; transition: all 0.2s; letter-spacing: 0.3px; }
    .method-btn:hover { background: #D3100D; border-color: #D3100D; color: #fff; }
    .method-btn.active { background: #D3100D; border-color: #D3100D; color: #fff; }
    
    .catalog-container { max-width: 1440px; margin: 0 auto; padding: 0 60px 80px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 30px; }
    .product-card { background: #111116; border-radius: 6px; overflow: hidden; transition: transform 0.3s ease, box-shadow 0.3s; display: flex; flex-direction: column; }
    .product-card:hover { transform: translateY(-4px); box-shadow: 0 10px 30px rgba(211, 16, 13, 0.15); }
    .product-image { width: 100%; height: 200px; overflow: hidden; }
    .product-image img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s; }
    .product-card:hover .product-image img { transform: scale(1.05); }
    .product-info { padding: 20px; flex: 1; display: flex; flex-direction: column; }
    .product-category { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: #D3100D; margin-bottom: 8px; }
    .product-name { font-size: 16px; font-weight: 500; margin-bottom: 8px; line-height: 1.3; }
    .product-desc { font-size: 13px; color: #888; line-height: 1.5; margin-bottom: 15px; flex: 1; }
    .product-meta { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
    .product-price { font-size: 18px; font-weight: 700; color: #fff; }
    .product-rating { display: flex; align-items: center; gap: 4px; font-size: 12px; color: #ffc107; }
    .no-results { text-align: center; padding: 60px 20px; color: #666; font-size: 16px; }
    .no-results strong { color: #D3100D; display: block; font-size: 20px; margin-bottom: 10px; text-transform: uppercase; }
    
    @media (max-width: 1024px) {
      .catalog-header, .methods-panel, .catalog-container { padding-left: 40px; padding-right: 40px; }
      .search-box input { width: 180px; }
    }
    @media (max-width: 768px) {
      .catalog-header { flex-direction: column; align-items: flex-start; }
      .catalog-controls { width: 100%; justify-content: space-between; }
      .search-box input { width: 100%; max-width: 200px; }
      .methods-panel, .catalog-container { padding-left: 20px; padding-right: 20px; }
      .products-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
    }
    @media (max-width: 480px) {
      .catalog-title { font-size: 1.6rem; }
      .search-box input, .filter-select { padding: 9px 14px; font-size: 12px; }
      .method-btn { padding: 7px 12px; font-size: 10px; }
      .product-name { font-size: 15px; }
      .product-price { font-size: 16px; }
    }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="site-header">
    <div class="header-left">
      <div class="logo">Ö</div>
      <div class="header-text">
        <span>BRANDING &<br>DESIGN STUDIO</span>
        <span>DOUBLE BAY 2028,<br>NEW YORK</span>
      </div>
    </div>
    <div class="header-center">
      <button class="menu-btn">
        <span></span><span></span><span></span>
      </button>
    </div>
    <div class="header-right">
      <div class="cart">
        <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="cart-badge">0</span>
      </div>
      <a href="index.html" class="btn-contact">НА ГЛАВНУЮ</a>
    </div>
  </header>

  <!-- КАТАЛОГ -->
  <main class="catalog-page">
    <div class="catalog-header">
      <h1 class="catalog-title">КАТАЛОГ УСЛУГ</h1>
      <div class="catalog-controls">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="Поиск услуг...">
        </div>
        <select class="filter-select" id="sortSelect">
          <option value="default">Сортировка</option>
          <option value="price-asc">По цене ↑</option>
          <option value="price-desc">По цене ↓</option>
          <option value="name-asc">По названию А-Я</option>
          <option value="name-desc">По названию Я-А</option>
          <option value="rating-desc">По рейтингу</option>
        </select>
      </div>
    </div>

    <!-- Категории -->
    <div class="catalog-container" style="padding-bottom: 20px;">
      <div class="category-filter" id="categoryFilter">
        <button class="category-btn active" data-category="all">Все</button>
        <button class="category-btn" data-category="branding">Брендинг</button>
        <button class="category-btn" data-category="web">Веб-дизайн</button>
        <button class="category-btn" data-category="development">Разработка</button>
        <button class="category-btn" data-category="marketing">Маркетинг</button>
        <button class="category-btn" data-category="consulting">Консалтинг</button>
      </div>
    </div>

    <!-- Кнопки методов массивов -->
    <div class="methods-panel">
      <div class="methods-grid">
        <button class="method-btn" data-method="filter-premium">🔥 Premium</button>
        <button class="method-btn" data-method="map-names">📝 Только названия</button>
        <button class="method-btn" data-method="sort-cheapest">💰 Дешёвые</button>
        <button class="method-btn" data-method="reduce-total">📊 Общая цена</button>
        <button class="method-btn" data-method="find-fast">⚡ Быстрый поиск</button>
        <button class="method-btn" data-method="some-highrate">⭐ Есть 5★</button>
        <button class="method-btn" data-method="every-hasimg">✅ Все с фото</button>
        <button class="method-btn" data-method="slice-first5">✂️ Первые 5</button>
        <button class="method-btn" data-method="concat-new">➕ +Новые</button>
        <button class="method-btn" data-method="reset">↩️ Сброс</button>
      </div>
    </div>

    <!-- Контейнер карточек -->
    <div class="catalog-container">
      <div id="productsGrid" class="products-grid"></div>
      <div id="noResults" class="no-results" style="display: none;">
        <strong>Ничего не найдено</strong>
        Попробуйте изменить параметры поиска или фильтрации
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="site-footer" style="background: #000; border-top: 1px solid #222;">
    <div class="footer-bottom" style="margin: 0; padding: 20px; text-align: center;">
      <p>© 2024 Görm Studio — Лабораторная работа №6</p>
    </div>
  </footer>

  <script src="script.js" defer></script>
</body>
</html>
